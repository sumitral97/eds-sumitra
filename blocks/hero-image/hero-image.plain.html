<section class="hero-image block"
         data-block-name="hero-image"
         data-aue-resource="hero-image">

    <div class="hero-image-wrapper">

        <picture>
            <source type="image/webp"
                    media="(min-width: 600px)"
                    srcset="./media/hero.webp"
                    data-aue-prop="imageLarge"
                    data-aue-type="image">

            <source type="image/webp"
                    srcset="./media/hero-small.webp"
                    data-aue-prop="imageSmall"
                    data-aue-type="image">

            <img src="./media/hero-small.webp"
                 alt="Hero Image"
                 width="1920"
                 height="550"
                 data-aue-prop="heroImage"
                 data-aue-type="image">
        </picture>

    </div>
</section>
